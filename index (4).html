const P={"1": {"type": "まっすぐ行動タイプ", "trait": "思い立ったら自分から動き、気持ちを素直に表現する", "strength": "決断力と行動力で、関係に新しい風を運ぶ", "need": "自分のペースで進みたい気持ちを尊重してもらう"}, "2": {"type": "やさしく寄り添うタイプ", "trait": "相手の気持ちをよく感じ取り、そっと支える", "strength": "思いやりと気配りで、安心できる空気をつくる", "need": "気持ちを言葉にして伝え合えること"}, "3": {"type": "明るく楽しむタイプ", "trait": "好奇心旺盛で、楽しいことを一緒に見つける", "strength": "明るさと柔軟さで、毎日に笑顔を増やす", "need": "自由な発想や思いつきの行動を受け止めてもらう"}, "4": {"type": "じっくり信頼タイプ", "trait": "誠実で慎重。時間をかけて信頼を育てる", "strength": "約束を大切にし、落ち着いた関係を築く", "need": "焦らず、自分たちの歩幅で進めること"}, "5": {"type": "自由を楽しむタイプ", "trait": "好奇心と行動力があり、新しい体験が好き", "strength": "変化や刺激を運び、関係を新鮮に保つ", "need": "束縛しすぎず、お互いの自由を認めること"}, "6": {"type": "愛情たっぷりタイプ", "trait": "身近な人を大切にし、愛情を行動で示す", "strength": "あたたかさと面倒見のよさで絆を深める", "need": "頑張りすぎず、支え合うバランス"}, "7": {"type": "自分の世界を大切にするタイプ", "trait": "物事を深く考え、一人の時間も大切にする", "strength": "洞察力と落ち着きで、深い会話を楽しめる", "need": "距離感や考える時間を尊重してもらう"}, "8": {"type": "華やかに前進するタイプ", "trait": "目標意識があり、現実的に物事を進める", "strength": "頼もしさと実行力で、二人の未来を形にする", "need": "対等な立場で意見を交わし、認め合うこと"}, "9": {"type": "大きな心で受け止めるタイプ", "trait": "視野が広く、相手の個性を受け入れようとする", "strength": "包容力と優しさで、穏やかな関係を育てる", "need": "自分の本音や希望も大切にすること"}, "11": {"type": "直感で感じ取るタイプ", "trait": "感受性が豊かで、言葉にしなくても空気を感じ取る", "strength": "繊細な気づきとひらめきで、心のつながりを深める", "need": "思い込みにせず、気持ちを確かめ合うこと"}, "22": {"type": "理想を形にするタイプ", "trait": "大きな ビジョン を持ち、現実的な一歩も大切にする", "strength": "計画性と発想力で、二人の夢を育てる", "need": "目標だけでなく、日々の気持ちにも目を向けること"}, "33": {"type": "愛と個性あふれるタイプ", "trait": "独自の感性と大きな愛情で、人を包み込む", "strength": "自由な発想と惜しみない優しさで、関係を豊かにする", "need": "相手に合わせすぎず、自分らしさも守ること"}};
function calc(date){if(!date)return null;let s=date.replaceAll('-','');let n=[...s].reduce((a,b)=>a+Number(b),0);while(n>9&&!([11,22,33].includes(n))){n=[...String(n)].reduce((a,b)=>a+Number(b),0)}return n}
function dateJP(v){if(!v)return '';const [y,m,d]=v.split('-');return `${y}年${Number(m)}月${Number(d)}日`}
function pairText(a,b){const A=P[a],B=P[b];const same=a===b;
let c1=same?`ふたりは似た感覚や大切にしたい価値観を持ち、自然体で分かり合いやすい組み合わせです。${A.trait}ところが共通点となり、安心して一緒に過ごせるでしょう。`:`${A.type}の${A.trait}ところと、${B.type}の${B.trait}ところが出会う組み合わせです。お互いに自分にはない魅力を感じ、違いを楽しみながら関係を育てていけます。`;
let attraction=[`${A.strength}ところが、${B.type}の心を惹きつけます。`,`${B.strength}ところが、${A.type}にとって新鮮な魅力になります。`,`一方が得意なことを、もう一方が自然に受け止められる関係です。`,`それぞれの個性を認め合うことで、ふたりならではの楽しさや安心感が生まれます。`];
let rel=same?`似ているからこそ気持ちを理解しやすく、同じ方向を向いたときには大きな力を発揮します。\n一方で、考え方が重なる分、譲れない部分も似ることがあります。\n${A.need}ことを意識すると、心地よい関係が長く続いていくでしょう。`:`ふたりは違う魅力を持ち、それぞれの得意な部分を補い合える関係です。\n相手の考え方を知るほど、新しい発見や学びが増えていくでしょう。\n${A.need}こと、そして${B.need}ことを大切にすると、より深い信頼につながります。`;
return {c1,attraction,rel}}
function makeReport(){const da=document.getElementById('dobA').value,db=document.getElementById('dobB').value;const a=calc(da),b=calc(db);if(!a||!b){document.getElementById('status').textContent='2人の生年月日を入力してください。';return}
const na=document.getElementById('nameA').value.trim()||'Aさん',nb=document.getElementById('nameB').value.trim()||'Bさん';
[['A',na,da,a],['B',nb,db,b]].forEach(([id,name,date,num])=>{document.getElementById('outName'+id).textContent=name;document.getElementById('outDob'+id).textContent=dateJP(date);document.getElementById('outNum'+id).textContent=num;document.getElementById('outType'+id).textContent=P[num].type;document.getElementById('img'+id).src=PANDA[num]});
const t=pairText(a,b);document.getElementById('compatibility').textContent=t.c1;document.getElementById('attraction').innerHTML=t.attraction.map(x=>`<p>♡ ${x}</p>`).join('');document.getElementById('relationship').textContent=t.rel;document.getElementById('status').textContent='鑑定書を作成しました。内容を確認して画像で保存できます。'}
async function saveImage(){if(!document.getElementById('outNumA').textContent||document.getElementById('outNumA').textContent==='—'){makeReport();if(document.getElementById('outNumA').textContent==='—')return}if(!window.html2canvas){document.getElementById('status').textContent='画像保存にはインターネット接続が必要です。';return}const el=document.getElementById('report');const canvas=await html2canvas(el,{scale:2,backgroundColor:'#fff9f3',useCORS:true});const a=document.createElement('a');a.download='michibiki_ふたりの相性鑑定.png';a.href=canvas.toDataURL('image/png');a.click();document.getElementById('status').textContent='鑑定書画像を保存しました。'}
</script></body></html>
